<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="歌い手名とセトリ画像から、ライブ後に投稿しやすいセトリ文面を作成できるツールです。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://setlist-maker-azure.vercel.app/" />
    <meta property="og:title" content="セトリ投稿メーカー" />
    <meta
      property="og:description"
      content="セトリ画像から、歌い手さん向けの投稿文を作成。コラボ・合唱もまとめてコピーできます。"
    />
    <meta property="og:image" content="https://setlist-maker-azure.vercel.app/assets/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="セトリ投稿メーカー" />
    <meta
      name="twitter:description"
      content="セトリ画像から、歌い手さん向けの投稿文を作成。コラボ・合唱もまとめてコピーできます。"
    />
    <meta name="twitter:image" content="https://setlist-maker-azure.vercel.app/assets/ogp.png" />
    <title>セトリ投稿メーカー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div>
          <h1>セトリ投稿メーカー</h1>
          <p>画像から投稿文を作成</p>
        </div>
        <a
          class="icon-link"
          href="https://x.com/Zer0__xx"
          target="_blank"
          rel="noreferrer"
          aria-label="Xを開く"
          title="X"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M17.6 3h3.1l-6.8 7.8L22 21h-6.4l-5-6.5L4.9 21H1.8l7.3-8.4L1.3 3h6.6l4.5 5.9L17.6 3Zm-1.1 16.2h1.7L7 4.7H5.2l11.3 14.5Z" />
          </svg>
        </a>
      </header>

      <main>
        <details class="guide-panel">
          <summary>
            <span>使い方</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </summary>
          <ol>
            <li>歌い手名を入力して、セトリ画像を追加します。</li>
            <li>「生成する」を押すと、投稿文の下書きが作られます。</li>
            <li>投稿プレビューを確認・編集して、「まとめてコピー」からSNSに貼り付けます。</li>
          </ol>
        </details>

        <section class="panel input-panel" aria-labelledby="input-title">
          <h2 id="input-title">作成内容</h2>

          <label class="field">
            <span>歌い手名</span>
            <input id="singerName" type="text" placeholder="山田太郎" autocomplete="name" />
          </label>

          <div class="upload-block">
            <div class="section-heading">
              <span>セトリ画像</span>
              <small>最大2枚</small>
            </div>

            <input id="imageInput" class="visually-hidden" type="file" accept="image/*" multiple />
            <button id="addImageButton" class="secondary-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
              </svg>
              画像を追加
            </button>

            <ul id="fileList" class="file-list" aria-live="polite"></ul>
            <p class="privacy-note">画像は保存されません</p>
          </div>

          <button id="generateButton" class="primary-button" type="button">生成する</button>
        </section>

        <section class="preview-section" aria-labelledby="preview-title">
          <div class="section-heading">
            <h2 id="preview-title">投稿プレビュー</h2>
            <span id="statusText" class="status-text">編集できます</span>
          </div>
          <textarea id="previewText" spellcheck="false" aria-label="投稿プレビュー"></textarea>
          <button id="copyButton" class="copy-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="8" y="8" width="11" height="11" rx="2" />
              <path d="M5 16H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            まとめてコピー
          </button>
        </section>
      </main>

      <footer class="site-footer">
        <p>created by Zero</p>
        <a
          class="icon-link compact"
          href="https://x.com/Zer0__xx"
          target="_blank"
          rel="noreferrer"
          aria-label="Xを開く"
          title="X"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M17.6 3h3.1l-6.8 7.8L22 21h-6.4l-5-6.5L4.9 21H1.8l7.3-8.4L1.3 3h6.6l4.5 5.9L17.6 3Zm-1.1 16.2h1.7L7 4.7H5.2l11.3 14.5Z" />
          </svg>
        </a>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
